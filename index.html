<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบบันทึกการประชุม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ec; --panel:#ffffff; --panel-2:#faf9f6; --ink:#1c2333; --muted:#687083; --line:#e2ded5; --line-2:#efece6;
  --accent:#1f3a68; --accent-ink:#ffffff; --accent-soft:#e7ecf5; --gold:#a8792e; --gold-soft:#f6eedf;
  --ok:#2c7a4b; --ok-soft:#e3f2e8; --warn:#9a5b0b; --warn-soft:#fbefdc; --bad:#b42318; --bad-soft:#fde7e5;
  --radius:10px; --shadow:0 1px 2px rgba(20,25,40,.06),0 4px 14px rgba(20,25,40,.05);
  --font:'Sarabun','Leelawadee UI','Tahoma',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--accent);color:#fff}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;letter-spacing:.2px}
.brand .mark{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.top .sp{flex:1}
.top .tbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:14px}
.top .tbtn:hover{background:rgba(255,255,255,.22)}
.saved{font-size:13px;opacity:.75;transition:opacity .3s}
#menuBtn{display:none}

.layout{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 52px)}
aside{border-right:1px solid var(--line);background:var(--panel-2);display:flex;flex-direction:column;min-width:0}
.side-head{padding:14px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.search{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}
.mlist{overflow:auto;padding:8px;flex:1}
.mitem{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:9px;padding:10px 11px;cursor:pointer;margin-bottom:4px}
.mitem:hover{background:#fff;border-color:var(--line)}
.mitem.on{background:#fff;border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.mitem .t{font-weight:600;font-size:14.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mitem .s{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.side-empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}

main{min-width:0;padding:22px 28px 60px}
.wrap{max-width:1180px;margin:0 auto}

/* generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14.5px;white-space:nowrap}
.btn:hover{border-color:#c9c3b6;background:#fdfcfa}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#18305a}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--line-2);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft);border-color:#f2c4bf}
.btn.sm{padding:4px 9px;font-size:13.5px}
.btn.w{width:100%}
.icon{width:30px;height:30px;padding:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--line-2);color:var(--muted);white-space:nowrap}
.b-prep{background:var(--warn-soft);color:var(--warn)}
.b-held{background:var(--accent-soft);color:var(--accent)}
.b-done{background:var(--ok-soft);color:var(--ok)}
.b-present{background:var(--ok-soft);color:var(--ok)}
.b-online{background:var(--accent-soft);color:var(--accent)}
.b-leave{background:var(--warn-soft);color:var(--warn)}
.b-absent{background:var(--bad-soft);color:var(--bad)}
.b-pending{background:var(--line-2);color:var(--muted)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:16.5px;font-weight:600}
label.f{display:grid;gap:4px;font-size:13.5px;color:var(--muted);font-weight:500}
.inp,select.inp,textarea.inp{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:15px;font-weight:400}
.inp:focus,textarea.inp:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
textarea.inp{resize:vertical;min-height:64px;line-height:1.6}
.grid{display:grid;gap:12px 14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:1/-1}
.hint{font-size:13px;color:var(--muted)}

/* meeting header */
.mhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:14px}
.mhead h1{margin:0;font-size:23px;line-height:1.3;font-weight:700}
.mhead .meta{color:var(--muted);font-size:14px;margin-top:4px;display:flex;gap:14px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{background:none;border:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab .n{font-size:12px;background:var(--line-2);border-radius:999px;padding:0 7px;color:var(--muted)}

/* agenda */
.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden}
.sec-h{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--panel-2);border-bottom:1px solid var(--line)}
.sec-h .no{font-weight:700;color:var(--accent);white-space:nowrap;font-size:15px}
.sec-h .inp{font-weight:600;background:transparent;border-color:transparent}
.sec-h .inp:hover{border-color:var(--line);background:#fff}
.sec-b{padding:12px 14px}
.item{border:1px solid var(--line-2);border-radius:9px;padding:12px;margin-bottom:10px;background:#fff}
.item-h{display:flex;gap:10px;align-items:flex-start}
.item-h .no{font-weight:600;color:var(--gold);padding-top:8px;min-width:34px}
.item-h .grow{flex:1;min-width:0}
.tools{display:flex;gap:2px}
.none{color:var(--muted);font-size:14px;padding:4px 2px 8px}
.sumbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:13.5px;color:var(--muted)}
.stat b{color:var(--ink);font-size:17px;margin-right:4px}

/* minutes */
.det{background:var(--panel-2);border-left:3px solid var(--line);padding:8px 12px;border-radius:0 8px 8px 0;font-size:14px;color:#444b5b;white-space:pre-wrap;margin:8px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{border:1px dashed #c8c1b2;background:#fff;border-radius:999px;padding:2px 10px;font-size:13px;cursor:pointer;color:#4a5161}
.chip:hover{border-style:solid;border-color:var(--accent);color:var(--accent)}
.res-label{font-weight:600;color:var(--accent);font-size:14px;margin-top:10px}
.act{display:grid;grid-template-columns:1fr 180px auto 30px;gap:6px;margin-top:6px;align-items:center}
.dcal{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;cursor:pointer;min-height:40px}
.dcal:hover{border-color:#c9c3b6}
.dcal.open{border-color:var(--accent);outline:2px solid var(--accent-soft)}
.dcal .ph{color:var(--muted)}
#calPop{position:absolute;z-index:45;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(20,25,40,.2);padding:12px;width:304px}
.cal-h{display:flex;gap:4px;align-items:center;margin-bottom:8px}
.cal-h select{flex:1;min-width:0;padding:5px 4px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;font-weight:500}
.cal-n{border:1px solid var(--line);background:#fff;border-radius:7px;width:32px;height:32px;cursor:pointer;font-size:16px;color:var(--accent)}
.cal-n:hover{background:var(--accent-soft)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-w{font-size:12.5px;color:var(--muted);padding:4px 0;font-weight:500}
.cal-d{border:none;background:none;border-radius:8px;height:36px;cursor:pointer;font-size:14.5px;color:var(--ink)}
.cal-d:hover{background:var(--accent-soft)}
.cal-d.sun{color:var(--bad)}
.cal-d.today{box-shadow:inset 0 0 0 1.5px var(--gold);font-weight:600}
.cal-d.sel,.cal-d.sel:hover{background:var(--accent);color:#fff;font-weight:600}
.cal-f{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--line-2)}
.tsel,.dsel{display:inline-flex;align-items:center;gap:4px;flex-wrap:nowrap}
.tsel select.inp,.dsel select.inp{width:auto;padding:7px 6px;cursor:pointer}
.tsel b{font-weight:600}
.tsel>span{color:var(--muted);font-size:14px;margin-left:2px}
.dsel select[data-dp=m]{min-width:0;flex:1}
.act .dsel select.inp{padding:5px 4px;font-size:14px}
.act .inp{padding:6px 9px;font-size:14px}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:13px;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:hover td{background:#fcfbf8}
.tbl .inp{padding:5px 8px;font-size:14px;border-color:transparent;background:transparent}
.tbl .inp:hover,.tbl .inp:focus{border-color:var(--line);background:#fff}
.tbl select.inp{border-color:var(--line);background:#fff;min-width:118px}
.sigimg{height:40px;max-width:130px;display:block;border-radius:4px}
.sigimg:hover{outline:2px solid var(--accent-soft)}
.tbl-wrap{overflow-x:auto}

/* print preview */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.seg button{border:none;background:none;padding:7px 14px;cursor:pointer;font-size:14.5px;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.lhcard{display:grid;grid-template-columns:auto minmax(0,1fr) 220px;gap:16px;align-items:start}
.lhcard .lgo{width:96px;height:96px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px;display:block;margin-bottom:6px}
@media (max-width:860px){.lhcard{grid-template-columns:1fr}}
.fontcard{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;padding:14px 18px}
.fontcard label.f{min-width:150px}
.fontcard .warn{font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:6px 10px}
.fontcard .okf{font-size:13px;color:var(--ok)}
.signcard{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center;border-color:#e3d3b0;background:linear-gradient(180deg,#fffdf8,#fff)}
.signcard .qr{width:150px;height:150px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px;cursor:zoom-in;display:grid;place-items:center}
.signcard .qr svg{width:100%;height:100%;display:block}
.signcard .qr.off{opacity:.25;cursor:default}
.signcard h3{margin:0 0 4px}
.signcard .link{font-family:Consolas,monospace;font-size:12.5px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;word-break:break-all;margin:8px 0;color:#3d4556;user-select:all}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14.5px;font-weight:500}
.switch input{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:999px;background:#cfd4dc;position:relative;cursor:pointer;transition:background .2s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{left:21px}
.qrfull{text-align:center}
.qrfull .qrbig{width:min(70vh,520px);max-width:100%;margin:10px auto;aspect-ratio:1}
.qrfull .qrbig svg{width:100%;height:100%}
@media (max-width:620px){.signcard{grid-template-columns:1fr}.signcard .qr{margin:0 auto}}
.cm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.cm-card{text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;transition:border-color .15s, box-shadow .15s;display:block;width:100%}
.cm-card:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(20,25,40,.08)}
.cm-name{font-weight:600;font-size:15.5px;line-height:1.35}
.cm-meta{font-size:13px;color:var(--muted);margin-top:4px}
.cm-chair{font-size:13px;color:var(--gold);margin-top:2px}
.paper-wrap{background:#d9d5cc;border-radius:var(--radius);padding:26px 12px;overflow-x:auto}
.paper{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:22mm 20mm 22mm 28mm;box-shadow:0 4px 24px rgba(0,0,0,.18)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(15,20,35,.45);z-index:50;display:grid;place-items:center;padding:16px}
.mbox{background:#fff;border-radius:14px;width:min(640px,100%);max-height:92vh;overflow:auto;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mbox h3{margin:0 0 4px;font-size:18px}
.pad{width:100%;height:220px;border:1.5px dashed #b9b2a3;border-radius:10px;background:#fffef9 repeating-linear-gradient(transparent 0 169px,#d6d0c3 169px 170px,transparent 170px 220px);touch-action:none;cursor:crosshair;display:block;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

/* kiosk */
.kiosk{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;overscroll-behavior:contain}
.k-top{background:var(--accent);color:#fff;padding:18px 26px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.k-top h2{margin:0;font-size:22px}
.k-top .m{opacity:.8;font-size:15px}
.k-body{max-width:900px;margin:0 auto;padding:26px 18px}
.k-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.k-name{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;cursor:pointer;font-size:17px;box-shadow:var(--shadow)}
.k-name:hover{border-color:var(--accent)}
.k-name small{display:block;color:var(--muted);font-size:13.5px}
.k-name.done{opacity:.55;cursor:default;background:var(--ok-soft)}
.k-big{font-size:18px;padding:12px 22px;border-radius:10px}
.k-done{text-align:center;padding:60px 10px}
.k-done .ok{width:84px;height:84px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto 16px;font-size:44px}

.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty h2{color:var(--ink);font-weight:600;margin:0 0 8px}
.gate{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}
.gate-card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 40px rgba(20,25,40,.12);padding:30px 28px;width:min(400px,100%);text-align:center}
.gate-logo{width:88px;height:88px;object-fit:contain}
.gate-card h1{font-size:22px;margin:10px 0 2px}
.gate .warn{font-size:14px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:10px 12px;text-align:left}
.saved{display:none}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1c2333;color:#fff;padding:9px 16px;border-radius:9px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}
#printArea{display:none}

@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  aside{position:fixed;top:52px;left:0;bottom:0;width:290px;z-index:30;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.2)}
  aside.open{transform:none}
  #menuBtn{display:inline-flex}
  main{padding:16px 16px 50px}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .span3{grid-column:1/-1}
  .act{grid-template-columns:1fr auto 30px}.act>.inp:first-child{grid-column:1/-1}
  .mhead{flex-direction:column}
  .top .lbl,.saved{display:none}
  .brand{white-space:nowrap}
}
@media (max-width:520px){
  .g2,.g3,.g4{grid-template-columns:1fr}.span2{grid-column:auto}
  .paper{padding:14mm 10mm}
}

/* ===== document styles (preview, print, Word) ===== */
</style>
<style id="docCss">
.doc{--df:'TH Sarabun New','Sarabun',sans-serif;--ds:16pt;font-family:var(--df);font-size:var(--ds);line-height:1.45;color:#000}
.doc p{margin:0}
.doc .c{text-align:center}
.doc .r{text-align:right}
.doc .h{font-weight:bold}
.doc .title{text-align:center;font-weight:bold;font-size:calc(var(--ds) + 2pt);line-height:1.35}
.doc .rule{border:none;border-top:1px solid #000;width:45%;margin:8pt auto 12pt}
.doc .dsec{font-weight:bold;margin-top:12pt}
.doc .dsub{font-weight:bold;margin-top:6pt;padding-left:1.5cm}
.doc .ind{text-indent:2.5cm;text-align:justify}
.doc .blk{padding-left:1.5cm}
.doc .res{padding-left:1.5cm;margin-top:4pt}
.doc .res b{font-weight:bold}
.doc table.pl{border-collapse:collapse;margin:2pt 0 6pt 0.5cm}
.doc table.pl td{padding:0 10pt 0 0;vertical-align:top;font-size:var(--ds)}
.doc table.sheet{border-collapse:collapse;width:100%;margin-top:8pt}
.doc table.sheet th,.doc table.sheet td{border:1px solid #000;padding:3pt 5pt;vertical-align:middle;font-size:calc(var(--ds) - 1pt)}
.doc table.sheet th{font-weight:bold;text-align:center;background:#f1f1f1}
.doc table.sheet td.n{text-align:center;width:1.1cm}
.doc table.sheet tr.blank td{height:1.05cm}
.doc table.atbl{border-collapse:collapse;margin:4pt 0 4pt 1.5cm;width:calc(100% - 1.5cm)}
.doc table.atbl th,.doc table.atbl td{border:1px solid #000;padding:2pt 5pt;font-size:calc(var(--ds) - 2pt)}
.doc .sig{margin-top:28pt;margin-left:38%;text-align:center}
.doc .sig p{margin-bottom:2pt;white-space:nowrap}
.doc .sigimg{height:1cm;max-width:3.4cm}
.doc .meta{margin:2pt 0}
.doc .mt{margin-top:10pt}
.doc .sm,.doc small{font-size:calc(var(--ds) - 2pt)}
.doc table.lh{border-collapse:collapse;margin:0 0 12pt}
.doc table.lh td{vertical-align:middle;padding:0}
.doc table.lh td.lh-i{padding-right:10pt}
.doc table.lh p{line-height:1.25}
.doc .lh-logo{display:block}
.doc .lh-c{text-align:center;margin-bottom:10pt}
.doc .lh-c .lh-logo{margin:0 auto 4pt}
</style>
<style id="docVars"></style>
<style>
@media print{
  @page{size:A4;margin:2.2cm 2cm 2cm 3cm}
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
}
</style>

<body>
<header class="top">
  <button class="tbtn" id="menuBtn" data-act="menu" aria-label="เมนู">☰</button>
  <div class="brand"><span class="mark"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l1 2h3v15H5V6h3z"/><path d="M9 12h6M9 16h4"/></svg></span>บันทึกการประชุม</div>
  <span class="sp"></span>
  <span class="saved" id="saved"></span>
  <button class="tbtn" data-act="syncnow" title="">☁ <span class="lbl" id="syncSt"></span></button>
  <button class="tbtn" data-act="export" title="ดาวน์โหลดข้อมูลทั้งหมดเป็นไฟล์สำรอง (.json)">⤓ <span class="lbl">สำรองข้อมูล</span></button>
  <button class="tbtn" data-act="import" title="นำเข้าไฟล์สำรอง (.json) — ข้อมูลจะถูกบันทึกขึ้น Google Sheet">⤒ <span class="lbl">นำเข้า</span></button>
  <button class="tbtn" data-act="account" title="บัญชี / ออกจากระบบ">👤 <span class="lbl">บัญชี</span></button>
  <input type="file" id="importFile" accept=".json,application/json" class="hidden">
</header>
<div class="layout">
  <aside id="side"></aside>
  <main id="main"></main>
</div>
<div id="modal" class="modal hidden"></div>
<div id="kiosk" class="kiosk hidden"></div>
<div id="printArea"></div>
<div id="toast"></div>
<div id="calPop" class="hidden"></div>
<div id="gate" class="gate hidden"></div>
<input type="file" id="logoFile" accept="image/png,image/jpeg" class="hidden">

<script src="config.js"></script>
<script src="assets/qrcode.js"></script>
<script>
/* ============ ข้อมูลพื้นฐาน ============ */
const KEY = 'meetingMinutes.v1';
const DEFAULT_SECTIONS = [
  'เรื่องที่ประธานแจ้งให้ที่ประชุมทราบ',
  'เรื่องรับรองรายงานการประชุม',
  'เรื่องสืบเนื่อง',
  'เรื่องเสนอเพื่อพิจารณา',
  'เรื่องเสนอเพื่อทราบ',
  'เรื่องอื่น ๆ (ถ้ามี)'
];
const STATUS = {
  pending:{t:'ยังไม่ลงชื่อ'}, present:{t:'มาประชุม'}, online:{t:'ประชุมออนไลน์'},
  leave:{t:'ลาประชุม'}, absent:{t:'ไม่มาประชุม'}
};
const MSTATUS = {prep:'เตรียมการ', held:'ประชุมแล้ว', done:'รับรองรายงานแล้ว'};
const ROLES = ['ประธานกรรมการ','รองประธานกรรมการ','กรรมการ','กรรมการและเลขานุการ','กรรมการและผู้ช่วยเลขานุการ','ผู้ช่วยเลขานุการ','ผู้เข้าร่วมประชุม','ผู้ชี้แจง'];
const RES_CHIPS = [
  'ที่ประชุมรับทราบ',
  'ที่ประชุมรับรองรายงานการประชุม โดยไม่มีการแก้ไข',
  'ที่ประชุมรับรองรายงานการประชุม โดยมีการแก้ไข ดังนี้',
  'ที่ประชุมพิจารณาแล้ว มีมติเห็นชอบ',
  'ที่ประชุมพิจารณาแล้ว มีมติอนุมัติ',
  'ที่ประชุมพิจารณาแล้ว มีมติเห็นชอบ โดยให้ปรับปรุงตามข้อเสนอแนะ',
  'มอบหมายให้'
];
const TH_DAYS = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const TH_MON = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_MON_S = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

/* ============ สถานะและการบันทึก ============ */
let S = load();
const ui = {tab:'info', doc:'agenda', q:'', k:null};
function load(){
  try{ const r = localStorage.getItem(KEY); if(r){ const d = JSON.parse(r); if(d && Array.isArray(d.meetings)) return d; } }catch(e){}
  return {meetings:[], cur:null};
}
let saveT;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(()=>{
    try{ localStorage.setItem(KEY, JSON.stringify(S)); const el=$('#saved'); el.textContent='บันทึกอัตโนมัติแล้ว '+tm(nowTime())+' น.'; scheduleSync(); }
    catch(e){ toast('บันทึกไม่สำเร็จ — พื้นที่เก็บข้อมูลของเบราว์เซอร์เต็มหรือถูกปิด กรุณากด "สำรองข้อมูล"'); }
  }, 250);
}
const $ = s => document.querySelector(s);
function flush(){ clearTimeout(saveT); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
window.addEventListener('pagehide', flush); window.addEventListener('beforeunload', flush);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flush(); });
const uid = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cur = () => S.meetings.find(m => m.id === S.cur);
const bare = t => String(t||'').replace(/^การประชุม\s*/,'');
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600); }
function thaiDate(iso, withDay=true){
  if(!iso) return '..........................';
  const d = new Date(iso+'T00:00:00'); if(isNaN(d)) return iso;
  return (withDay?'วัน'+TH_DAYS[d.getDay()]+'ที่ ':'')+d.getDate()+' '+TH_MON[d.getMonth()]+' พ.ศ. '+(d.getFullYear()+543);
}
function thaiShort(iso){ if(!iso) return '-'; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; return d.getDate()+' '+TH_MON_S[d.getMonth()]+' '+String(d.getFullYear()+543).slice(-2); }
const tm = t => t ? t.replace(':','.') : '.........';
const nowTime = () => new Date().toTimeString().slice(0,5);

function newMeeting(o={}){
  return Object.assign({
    id:uid(), title:'', org:'', no:'', date:today(), start:'09:00', end:'12:00', venue:'', mode:'onsite', link:'',
    chair:'', secretary:'', status:'prep',
    sections: DEFAULT_SECTIONS.map(t=>({id:uid(), title:t})), items:[], people:[],
    actualStart:'', actualEnd:'', recorder:'', checker:'', opening:'', created:Date.now()
  }, o);
}
const newItem = (sec, o={}) => Object.assign({id:uid(), sec, title:'', presenter:'', mins:'', detail:'', attach:'', discussion:'', resolution:'', actions:[]}, o);
const newPerson = (o={}) => Object.assign({updated:Date.now(), id:uid(), name:'', position:'', org:'', role:'กรรมการ', type:'member', status:'pending', note:'', time:'', sig:''}, o);

/* ============ แถบด้านข้าง ============ */
function renderSide(){
  $('#side').innerHTML = `
    <div class="side-head">
      <button class="btn primary w" data-act="new">＋ สร้างการประชุมใหม่</button>
      <button class="btn w" data-act="committees">👥 รายชื่อคณะกรรมการ</button>
      <input class="search" placeholder="ค้นหาการประชุม…" data-ui="q" value="${esc(ui.q)}">
    </div>
    <div class="mlist" id="mlist"></div>`;
  renderSideList();
}
function renderSideList(){
  const q = ui.q.trim().toLowerCase();
  const list = [...S.meetings].sort((a,b)=>(b.date||'').localeCompare(a.date||'') || b.created-a.created)
    .filter(m => !q || [m.title,m.no,m.org,m.venue].join(' ').toLowerCase().includes(q));
  $('#mlist').innerHTML = list.length ? list.map(m=>`
    <button class="mitem ${m.id===S.cur?'on':''}" data-act="open" data-id="${m.id}">
      <div class="t">${esc(m.title||'(ยังไม่ตั้งชื่อการประชุม)')}</div>
      <div class="s">${m.no?'<span>ครั้งที่ '+esc(m.no)+'</span>':''}<span>${thaiShort(m.date)}</span><span class="badge b-${m.status}">${MSTATUS[m.status]}</span></div>
    </button>`).join('') : `<div class="side-empty">${S.meetings.length?'ไม่พบการประชุมที่ค้นหา':'ยังไม่มีการประชุม'}</div>`;
}

/* ============ ส่วนหลัก ============ */
function render(){
  closeCal();
  renderSide();
  const m = cur();
  const main = $('#main');
  if(!m){
    main.innerHTML = `<div class="wrap"><div class="empty">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#a8792e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l1 2h3v16H5V5h3z"/><path d="M9 11h6M9 15h6M9 19h3"/></svg>
      <h2>เริ่มต้นเตรียมการประชุม</h2>
      <p>สร้างการประชุม → จัดทำระเบียบวาระ → ลงชื่อผู้เข้าประชุม → บันทึกรายงาน → พิมพ์หรือส่งออกเป็น Word<br><span class="hint">ข้อมูลทั้งหมดบันทึกบน Google Sheet อัตโนมัติ ทุกคนที่เข้าระบบเห็นข้อมูลชุดเดียวกัน</span></p>
      <div class="row" style="justify-content:center;margin-top:16px">
        <button class="btn primary" data-act="new">＋ สร้างการประชุมใหม่</button>
      </div></div></div>`;
    return;
  }
  const cnt = {
    items: m.items.length,
    people: m.people.length,
    rec: m.items.filter(i=>i.resolution.trim()).length
  };
  const tabs = [
    ['info','ข้อมูลการประชุม',''],
    ['agenda','ระเบียบวาระ',cnt.items],
    ['people','ผู้เข้าประชุม',cnt.people],
    ['minutes','บันทึกการประชุม',cnt.items?cnt.rec+'/'+cnt.items:''],
    ['print','พิมพ์ / ส่งออก','']
  ];
  main.innerHTML = `<div class="wrap">
    <div class="mhead">
      <div>
        <h1>${esc(m.title||'(ยังไม่ตั้งชื่อการประชุม)')}${m.no?' <span style="font-weight:500;color:var(--muted)">ครั้งที่ '+esc(m.no)+'</span>':''}</h1>
        <div class="meta"><span>📅 ${thaiDate(m.date)}</span><span>🕘 ${tm(m.start)}–${tm(m.end)} น.</span>${m.venue?'<span>📍 '+esc(m.venue)+'</span>':''}</div>
      </div>
      <select class="inp" style="width:auto" data-b="m.status" data-rr="side">${Object.entries(MSTATUS).map(([k,v])=>`<option value="${k}" ${m.status===k?'selected':''}>${v}</option>`).join('')}</select>
    </div>
    <nav class="tabs">${tabs.map(([k,t,n])=>`<button class="tab ${ui.tab===k?'on':''}" data-act="tab" data-id="${k}">${t}${n!==''?'<span class="n">'+n+'</span>':''}</button>`).join('')}</nav>
    <div id="pane">${({info:paneInfo,agenda:paneAgenda,people:panePeople,minutes:paneMinutes,print:panePrint})[ui.tab](m)}</div>
  </div>`;
  autosizeAll();
}

function fld(label, bind, val, opt={}){
  const type = opt.type||'text';
  const inner = type==='calendar' ? calField(bind, val, opt.rr)
    : type==='time' ? timeSel(bind, val, opt.rr, opt.empty)
    : type==='date' ? dateSel(bind, val, opt.rr, opt.empty)
    : type==='textarea'
    ? `<textarea class="inp" data-b="${bind}" placeholder="${esc(opt.ph||'')}" ${opt.rr?'data-rr="'+opt.rr+'"':''}>${esc(val)}</textarea>`
    : type==='select'
    ? `<select class="inp" data-b="${bind}" ${opt.rr?'data-rr="'+opt.rr+'"':''}>${opt.options.map(([k,v])=>`<option value="${esc(k)}" ${val===k?'selected':''}>${esc(v)}</option>`).join('')}</select>`
    : `<input class="inp" type="${type}" data-b="${bind}" value="${esc(val)}" placeholder="${esc(opt.ph||'')}" ${opt.list?'list="'+opt.list+'"':''} ${opt.rr?'data-rr="'+opt.rr+'"':''}>`;
  return `<label class="f ${opt.cls||''}">${label}${inner}</label>`;
}

/* ---------- ช่องเวลา/วันที่แบบไทย ---------- */
const pad2 = n => String(n).padStart(2,'0');
function timeSel(bind, val, rr, allowEmpty){
  const [h, mi] = (val||'').split(':');
  const hs = Array.from({length:24}, (_,i)=>pad2(i));
  const ms = []; for(let i=0;i<60;i+=5) ms.push(pad2(i));
  if(mi && !ms.includes(mi)){ ms.push(mi); ms.sort(); }
  const o = (arr,v) => (allowEmpty?'<option value="">--</option>':'') + arr.map(x=>`<option value="${x}" ${x===v?'selected':''}>${x}</option>`).join('');
  return `<span class="tsel" data-tb="${bind}" ${rr?`data-rr="${rr}"`:''}><select class="inp" data-tp="h" aria-label="ชั่วโมง">${o(hs,h)}</select><b>.</b><select class="inp" data-tp="m" aria-label="นาที">${o(ms,mi)}</select><span>น.</span></span>`;
}
function dateSel(bind, val, rr, allowEmpty, short){
  const [y, mo, d] = (val||'').split('-').map(x=>parseInt(x)||'');
  const cy = new Date().getFullYear();
  const ys = []; for(let i=cy-3;i<=cy+3;i++) ys.push(i); if(y && !ys.includes(y)){ ys.push(y); ys.sort(); }
  const e = allowEmpty ? '<option value="">'+(short?'-':'--')+'</option>' : '';
  return `<span class="dsel" data-db="${bind}" ${rr?`data-rr="${rr}"`:''}>
    <select class="inp" data-dp="d" aria-label="วันที่">${e}${Array.from({length:31},(_,i)=>`<option value="${i+1}" ${d===i+1?'selected':''}>${i+1}</option>`).join('')}</select>
    <select class="inp" data-dp="m" aria-label="เดือน">${e}${(short?TH_MON_S:TH_MON).map((t,i)=>`<option value="${i+1}" ${mo===i+1?'selected':''}>${t}</option>`).join('')}</select>
    <select class="inp" data-dp="y" aria-label="ปี พ.ศ.">${e}${ys.map(x=>`<option value="${x}" ${y===x?'selected':''}>${short?'':'พ.ศ. '}${x+543}</option>`).join('')}</select></span>`;
}
function readTimeSel(box){
  const h = box.querySelector('[data-tp=h]').value, m = box.querySelector('[data-tp=m]');
  if(!h) return '';
  if(!m.value) m.value = '00';
  return h+':'+m.value;
}
function readDateSel(box){
  const ds = box.querySelector('[data-dp=d]'), ms = box.querySelector('[data-dp=m]'), ys = box.querySelector('[data-dp=y]');
  if(!ds.value || !ms.value || !ys.value) return '';
  const y = +ys.value, mo = +ms.value, max = new Date(y, mo, 0).getDate();
  if(+ds.value > max) ds.value = String(max);
  return y+'-'+pad2(mo)+'-'+pad2(ds.value);
}

/* ---------- ปฏิทินเลือกวันที่ (แบบไทย) ---------- */
const CAL_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1f3a68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
function calField(bind, val, rr){
  return `<button type="button" class="inp dcal" data-cal="${bind}" ${rr?`data-rr="${rr}"`:''} data-v="${esc(val)}" aria-haspopup="dialog">${val?`<span>${thaiDate(val)}</span>`:'<span class="ph">เลือกวันที่</span>'}${CAL_ICON}</button>`;
}
let cal = null;
function openCal(btn){
  const v = btn.dataset.v, d = v ? new Date(v+'T00:00:00') : new Date();
  cal = {btn, y:d.getFullYear(), m:d.getMonth()};
  btn.classList.add('open');
  renderCal();
  const pop = $('#calPop'), r = btn.getBoundingClientRect();
  pop.classList.remove('hidden');
  const left = Math.max(8, Math.min(r.left, window.innerWidth - pop.offsetWidth - 8));
  let top = r.bottom + 6;
  if(top + pop.offsetHeight > window.innerHeight - 8 && r.top - pop.offsetHeight - 6 > 8) top = r.top - pop.offsetHeight - 6;
  pop.style.left = (left + window.scrollX) + 'px';
  pop.style.top = (top + window.scrollY) + 'px';
}
function closeCal(){
  if(!cal) return;
  cal.btn.classList.remove('open'); cal = null;
  $('#calPop').classList.add('hidden');
}
function renderCal(){
  const {y, m, btn} = cal, sel = btn.dataset.v, td = today();
  const first = new Date(y, m, 1).getDay(), days = new Date(y, m+1, 0).getDate();
  const cy = new Date().getFullYear(), ys = [];
  for(let i=Math.min(cy, y)-5; i<=Math.max(cy, y)+5; i++) ys.push(i);
  let cells = '';
  for(let i=0;i<first;i++) cells += '<span></span>';
  for(let d=1; d<=days; d++){
    const iso = y+'-'+pad2(m+1)+'-'+pad2(d), dow = (first+d-1)%7;
    cells += `<button type="button" class="cal-d ${dow===0?'sun':''} ${iso===td?'today':''} ${iso===sel?'sel':''}" data-cd="${iso}" title="${thaiDate(iso)}">${d}</button>`;
  }
  $('#calPop').innerHTML = `
    <div class="cal-h">
      <button type="button" class="cal-n" data-cn="-1" aria-label="เดือนก่อน">‹</button>
      <select data-cm aria-label="เดือน">${TH_MON.map((t,i)=>`<option value="${i}" ${i===m?'selected':''}>${t}</option>`).join('')}</select>
      <select data-cy aria-label="ปี พ.ศ." style="flex:0 0 84px">${ys.map(x=>`<option value="${x}" ${x===y?'selected':''}>${x+543}</option>`).join('')}</select>
      <button type="button" class="cal-n" data-cn="1" aria-label="เดือนถัดไป">›</button>
    </div>
    <div class="cal-g">${['อา','จ','อ','พ','พฤ','ศ','ส'].map((w,i)=>`<span class="cal-w" ${i===0?'style="color:var(--bad)"':''}>${w}</span>`).join('')}${cells}</div>
    <div class="cal-f"><button type="button" class="btn sm" data-ct>วันนี้</button><button type="button" class="btn sm ghost" data-cx>ปิด</button></div>`;
}
function pickCal(iso){
  const btn = cal.btn, bind = btn.dataset.cal, rr = btn.dataset.rr;
  setBind(bind, iso); save();
  btn.dataset.v = iso;
  btn.innerHTML = `<span>${thaiDate(iso)}</span>${CAL_ICON}`;
  closeCal();
  if(rr==='head') refreshHead();
  btn.focus();
}
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-cal]');
  if(t){ if(cal && cal.btn===t) closeCal(); else { closeCal(); openCal(t); } return; }
  if(cal && !e.composedPath().includes($('#calPop'))) closeCal();
});
$('#calPop').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b || !cal) return;
  if(b.dataset.cd) pickCal(b.dataset.cd);
  else if(b.dataset.cn){ cal.m += +b.dataset.cn; if(cal.m<0){cal.m=11;cal.y--;} if(cal.m>11){cal.m=0;cal.y++;} renderCal(); }
  else if(b.hasAttribute('data-ct')) pickCal(today());
  else if(b.hasAttribute('data-cx')) closeCal();
});
$('#calPop').addEventListener('change', e=>{
  if(!cal) return;
  if(e.target.hasAttribute('data-cm')) cal.m = +e.target.value;
  if(e.target.hasAttribute('data-cy')) cal.y = +e.target.value;
  renderCal();
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && cal){ const b=cal.btn; closeCal(); b.focus(); } });
window.addEventListener('resize', closeCal);

/* ---------- ข้อมูลการประชุม ---------- */
function paneInfo(m){
  const others = S.meetings.filter(x=>x.id!==m.id);
  return `
  <div class="card"><h3>รายละเอียดการประชุม</h3>
    <div class="grid g4">

function quorum(m){
  const mem = m.people.filter(p=>p.type==='member');
  if(!mem.length) return '';
  const here = mem.filter(p=>p.status==='present'||p.status==='online').length;
  const need = Math.floor(mem.length/2)+1;
  const ok = here>=need;
  return `<div class="stat" style="border-color:${ok?'#b9dcc6':'#f0d3a7'};background:${ok?'var(--ok-soft)':'var(--warn-soft)'}">องค์ประชุม: <b style="color:${ok?'var(--ok)':'var(--warn)'}">${here}/${mem.length}</b>${ok?'ครบองค์ประชุม':'ต้องการอย่างน้อย '+need+' คน'}</div>`;
}

/* ---------- ลิงก์ / QR หน้าลงชื่อเข้าประชุม (signin.html) ---------- */
function signKeyNew(){ const a = new Uint8Array(12); (crypto.getRandomValues ? crypto.getRandomValues(a) : a.forEach((_,i)=>a[i]=Math.random()*256)); return [...a].map(b=>b.toString(16).padStart(2,'0')).join(''); }
function signBase(){
  if(/^https?:$/.test(location.protocol)) return new URL('signin.html', location.href).href;
  const site = String((window.APP_CONFIG||{}).SITE_URL||'').trim();
  return site ? new URL('signin.html', site.endsWith('/') ? site : site+'/').href : '';
}
function signUrl(m){ const b = signBase(); return b && m.signKey ? b + '?m=' + encodeURIComponent(m.id) + '&k=' + m.signKey : ''; }
function qrSvg(text){
  try{ const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({cellSize:4, margin:2, scalable:true}); }
  catch(e){ return '<span class="hint">สร้าง QR ไม่ได้</span>'; }
}
function signCard(m){
  if(!m.signKey){ m.signKey = signKeyNew(); save(); }
  const url = signUrl(m), open = m.signOpen !== false, pending = typeof isDirty==='function' && isDirty(m);
  return `<div class="card signcard">
    <div class="qr ${open&&url?'':'off'}" ${open&&url?'data-act="qr-full"':''} title="คลิกเพื่อขยาย QR">${url ? qrSvg(url) : '<span class="hint">—</span>'}</div>
    <div>
      <div class="row" style="justify-content:space-between"><h3>📱 หน้าลงชื่อเข้าประชุม</h3>
        <label class="switch"><input type="checkbox" data-act="sign-open" ${open?'checked':''}> ${open?'เปิดรับลงชื่อ':'ปิดรับลงชื่อ'}</label></div>
      <div class="hint" style="font-size:14px">ให้ผู้เข้าประชุมสแกน QR ด้วยมือถือ หรือเปิดลิงก์บน iPad หน้าห้องประชุม — ไม่ต้องใช้รหัสผ่าน รายชื่อที่ลงแล้วจะขึ้นในตารางด้านล่างอัตโนมัติ</div>
      ${url ? `<div class="link">${esc(url)}</div>` : `<div class="warn" style="font-size:13.5px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 10px;margin:8px 0">เปิดหน้านี้จากเว็บ GitHub เพื่อสร้างลิงก์ที่ใช้กับมือถือได้ (หรือใส่ SITE_URL ใน config.js)</div>`}
      ${pending ? '<div class="hint" style="color:var(--warn)">⟳ กำลังบันทึกขึ้น Google Sheet — ลิงก์จะใช้ได้เมื่อบันทึกเสร็จ</div>' : ''}
      <div class="row" style="margin-top:6px">
        ${url ? `<a class="btn primary sm" href="${esc(url)}" target="_blank" rel="noopener" style="text-decoration:none">เปิดหน้าลงชื่อ ↗</a>
        <button class="btn sm" data-act="sign-copy">คัดลอกลิงก์</button>
        <button class="btn sm" data-act="qr-full">แสดง QR เต็มจอ</button>` : ''}
        <button class="btn sm ghost" data-act="sign-reset" title="ลิงก์และ QR เดิมจะใช้ไม่ได้">สร้างลิงก์ใหม่</button>
      </div>
    </div>
  </div>`;
}
function copyText(t){
  const ok = () => toast('คัดลอกลิงก์แล้ว');
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(ok, fb); else fb();
  function fb(){ const ta=document.createElement('textarea'); ta.value=t; ta.style.cssText='position:fixed;left:-9999px'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); ok(); }catch(e){ toast('คัดลอกไม่สำเร็จ'); } ta.remove(); }
}
function qrFull(m){
  const url = signUrl(m); if(!url) return;
  openModal(`<div class="qrfull"><h3 style="font-size:22px">สแกนเพื่อลงชื่อเข้าประชุม</h3>
    <p class="hint" style="margin:2px 0 0;font-size:15px">${esc(m.title||'')}${m.no?' ครั้งที่ '+esc(m.no):''} · ${thaiDate(m.date)}</p>
    <div class="qrbig">${qrSvg(url)}</div>
    <div class="hint" style="word-break:break-all;font-size:12.5px">${esc(url)}</div>
    <div class="row" style="justify-content:center;margin-top:14px"><button class="btn" data-close>ปิด</button></div></div>`);
  $('#modal .mbox').style.width = 'min(760px,100%)';
}

function docFont(){ const f = Object.assign({family:'TH Sarabun New', size:16}, S.font||{}); f.size = +f.size||16; return f; }
function applyDocFont(){
  const f = docFont();

/* ตรวจว่ามีฟอนต์ในเครื่องหรือไม่
   1) ถ้าผู้ใช้อนุญาตให้อ่านรายชื่อฟอนต์ (Chrome/Edge) ใช้รายชื่อจริงจาก Windows — แม่นยำที่สุด
   2) ถ้ายังไม่อนุญาต ใช้วิธีวัดความกว้างตัวอักษรเทียบกับฟอนต์พื้นฐาน 3 แบบ */
let localFonts = null;
async function loadLocalFonts(){
  if(!window.queryLocalFonts) throw new Error('unsupported');
  const list = await window.queryLocalFonts();
  localFonts = [...new Set(list.map(f=>f.family))].sort((a,b)=>a.localeCompare(b));
  return localFonts;
}
function fontAvailable(name){
  if(!name) return false;
  if(localFonts && localFonts.length) return localFonts.some(f=>f.toLowerCase()===name.toLowerCase());
  const pr = document.createElement('span');
  pr.textContent = 'mmmmmmmmmmlli WWW กขคงจฉชซฌญ ภาษาไทย ๑๒๓ 0123456789';
  pr.style.cssText = 'position:absolute;left:-9999px;top:-9999px;font-size:60px;line-height:normal;white-space:nowrap;visibility:hidden';
  document.body.appendChild(pr);
  const ok = ['monospace','serif','sans-serif','cursive'].some(base=>{
    pr.style.fontFamily = base; const w0 = pr.offsetWidth, h0 = pr.offsetHeight;
    pr.style.fontFamily = `"${name.replace(/"/g,'')}", ${base}`; return pr.offsetWidth!==w0 || pr.offsetHeight!==h0;
  });
  pr.remove(); return ok;
}
function nearNames(name){
  if(!localFonts) return [];
  const k = name.toLowerCase().replace(/[\s\-_]/g,'');
  return localFonts.filter(f=>{ const g=f.toLowerCase().replace(/[\s\-_]/g,''); return g===k || g.includes(k) || k.includes(g) && g.length>4; }).slice(0,4);
}
function openFontPicker(){
  if(!window.queryLocalFonts){ toast('เบราว์เซอร์นี้ไม่รองรับการอ่านรายชื่อฟอนต์ — กรุณาเปิดด้วย Chrome หรือ Edge'); return; }
  loadLocalFonts().then(list=>{
    if(!list.length){ toast('ไม่ได้รับอนุญาตให้อ่านรายชื่อฟอนต์ — กด “อนุญาต” ที่แถบด้านบนของเบราว์เซอร์'); return; }
    const thaiFirst = f => /^(TH |TH|Angsana|Cordia|Browallia|Leelawadee|Tahoma|Sarabun|Niramit|Kanit|Prompt|Mitr|Pridi|Taviraj|Trirong|Chakra|Krub|K2D|KoHo|Kodchasan|Bai Jamjuree|Fah|Charm|Srisakdi|Mali|IBM Plex Sans Thai|Noto (Sans|Serif) Thai|Lily|Iris|Jasmine|Freesia|Kodchiang|Eucrosia|Dilleni|Angsana)/i.test(f) ? 0 : 1;
    const sorted = [...list].sort((a,b)=>thaiFirst(a)-thaiFirst(b) || a.localeCompare(b));
    openModal(`<h3>เลือกฟอนต์ที่ติดตั้งในเครื่อง</h3><p class="hint" style="margin:0 0 10px">พบ ${list.length} ฟอนต์ — ฟอนต์ภาษาไทยแสดงไว้ก่อน</p>
      <input class="inp" id="fq" placeholder="ค้นหาชื่อฟอนต์ เช่น sarabun" style="margin-bottom:8px">
      <div id="flist" style="max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:9px"></div>
      <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-close>ปิด</button></div>`);
    const draw = q => { q=(q||'').toLowerCase(); $('#flist').innerHTML = sorted.filter(f=>!q||f.toLowerCase().includes(q)).slice(0,300).map(f=>`<button class="mitem" data-pickfont="${esc(f)}" style="border-radius:0;margin:0;border-bottom:1px solid var(--line-2)"><div style="font-family:'${esc(f).replace(/'/g,'')}',sans-serif;font-size:20px;line-height:1.3">${esc(f)} — ภาษาไทย ๑๒๓</div></button>`).join('') || '<div class="none" style="padding:14px">ไม่พบ</div>'; };
    draw(''); $('#fq').oninput = e => draw(e.target.value); $('#fq').focus();
    $('#flist').onclick = e => { const b=e.target.closest('[data-pickfont]'); if(!b) return;
      const fd = FONTS.find(x=>x[0]===b.dataset.pickfont);
      S.font = Object.assign({}, docFont(), {family:b.dataset.pickfont}, fd?{size:fd[1]}:{}); save(); applyDocFont(); closeModal(); render(); toast('เปลี่ยนฟอนต์เป็น '+b.dataset.pickfont); };
    if(ui.tab==='print') render();
  }).catch(err=>{ toast(err.message==='unsupported'?'เบราว์เซอร์นี้ไม่รองรับ — ใช้ Chrome หรือ Edge':'ไม่ได้รับอนุญาตให้อ่านรายชื่อฟอนต์'); });
}
document.addEventListener('click', e=>{ const b=e.target.closest('[data-pickname]'); if(!b) return; S.font=Object.assign({}, docFont(), {family:b.dataset.pickname}); save(); applyDocFont(); render(); });

function fontCard(){
  const f = docFont(), known = FONTS.some(x=>x[0]===f.family), have = fontAvailable(f.family);
  return `<div class="card fontcard">
    <label class="f">ฟอนต์เอกสาร<select class="inp" data-font="family">

    <label class="f" style="min-width:110px">ขนาด<select class="inp" data-font="size">${[10,11,12,13,14,15,16,17,18,20].map(v=>`<option value="${v}" ${f.size===v?'selected':''}>${v} pt</option>`).join('')}</select></label>

    <button class="btn sm" data-act="font-pick" style="margin-bottom:4px">🔍 เลือกจากฟอนต์ที่ติดตั้งในเครื่อง</button>
    <div style="flex-basis:100%">${have
      ? `<span class="okf">✓ พบฟอนต์ “${esc(f.family)}” ในเครื่อง${localFonts?' (ตรวจจากรายชื่อฟอนต์ของ Windows)':''}</span>`
      : `<div class="warn">ตรวจไม่พบฟอนต์ “${esc(f.family)}”${localFonts?' ในรายชื่อฟอนต์ของเครื่อง':''} ${nearNames(f.family).length?`— ในเครื่องมีชื่อใกล้เคียง: ${nearNames(f.family).map(n=>`<button class="chip" data-pickname="${esc(n)}">${esc(n)}</button>`).join(' ')}`:''}
         <br>• ถ้าเพิ่งติดตั้งฟอนต์ ให้ปิดเบราว์เซอร์ทุกหน้าต่างแล้วเปิดใหม่ &nbsp;• ชื่อฟอนต์ต้องตรงกับที่ Windows ใช้ — กด “เลือกจากฟอนต์ที่ติดตั้งในเครื่อง” เพื่อเลือกชื่อที่ถูกต้อง
         <br>ไฟล์ Word ยังใช้ชื่อฟอนต์นี้ และจะแสดงถูกต้องในเครื่องที่มีฟอนต์ชื่อนี้</div>`}</div>
  </div>`;
}
document.addEventListener('change', e=>{
  const k = e.target.dataset && e.target.dataset.font; if(!k) return;
  S.font = Object.assign({}, docFont());
  if(k==='family'){
    if(e.target.value==='__other'){ S.font.family = ''; }
    else { const fd = FONTS.find(x=>x[0]===e.target.value); S.font.family = e.target.value; if(fd) S.font.size = fd[1]; }
  }
  else if(k==='custom') S.font.family = e.target.value.trim();
  else if(k==='size') S.font.size = +e.target.value;
  save(); applyDocFont(); render();
  if(k==='family' && e.target.value==='__other') setTimeout(()=>{ const i=document.querySelector('[data-font=custom]'); i&&i.focus(); },30);
});

}

function setBind(b, v){
  const m = cur(); if(!m) return;
  const p = b.split('.');
  if(p[0]==='m') m[p[1]] = v;
  else if(p[0]==='s'){ const s=m.sections.find(x=>x.id===p[1]); if(s) s[p[2]]=v; }
  else if(p[0]==='i'){ const it=m.items.find(x=>x.id===p[1]); if(it) it[p[2]]=v; }
  else if(p[0]==='p'){ const pp=m.people.find(x=>x.id===p[1]); if(pp){ pp[p[2]]=v; pp.updated=Date.now(); if(p[2]==='status' && (v==='present'||v==='online') && !pp.time) pp.time=nowTime(); } }
  else if(p[0]==='a'){ const it=m.items.find(x=>x.id===p[1]); const a=it&&it.actions.find(x=>x.id===p[2]); if(a) a[p[3]]=v; }
}

function moveIn(arr, idx, dir, same){
  // ย้ายภายในกลุ่มเดียวกัน (same = ฟังก์ชันตรวจว่าอยู่กลุ่มเดียวกัน)
  let j = idx + dir;
  while(j>=0 && j<arr.length && same && !same(arr[j])) j += dir;
  if(j<0 || j>=arr.length) return false;
  [arr[idx], arr[j]] = [arr[j], arr[idx]]; return true;
}

function duplicate(m){
  const secMap = {};
  const sections = m.sections.map(s=>{ const n={id:uid(), title:s.title}; secMap[s.id]=n.id; return n; });
  const nx = newMeeting({
    title:m.title, committee:m.committee, org:m.org, venue:m.venue, mode:m.mode, link:m.link, start:m.start, end:m.end, chair:m.chair, secretary:m.secretary, recorder:m.recorder, checker:m.checker,
    no: nextNo(m.no), sections,
    people: m.people.filter(p=>p.type==='member').map(p=>newPerson({name:p.name, position:p.position, org:p.org, role:p.role, type:'member'}))
  });
  const secApprove = sections.find(s=>s.title.includes('รับรอง')), secCont = sections.find(s=>s.title.includes('สืบเนื่อง'));
  if(secApprove) nx.items.push(newItem(secApprove.id, {title:'รับรองรายงานการประชุม'+bare(m.title)+(m.no?' ครั้งที่ '+m.no:''), presenter:m.secretary||'', detail:'ฝ่ายเลขานุการได้จัดทำรายงานการประชุม'+(m.no?'ครั้งที่ '+m.no:'')+' เมื่อ'+thaiDate(m.date)+' เรียบร้อยแล้ว จึงเสนอที่ประชุมเพื่อพิจารณารับรอง'}));
  if(secCont){
    m.items.forEach(it=>{
      const acts = it.actions.filter(a=>a.task.trim());
      if(acts.length) nx.items.push(newItem(secCont.id, {title:it.title, detail:'ติดตามผลการดำเนินการตามมติที่ประชุม:\n'+acts.map(a=>'- '+a.task+(a.owner?' ('+a.owner+')':'')).join('\n')}));
    });
  }
  S.meetings.push(nx); S.cur = nx.id; ui.tab='info'; save(); render(); toast('สร้างการประชุมครั้งถัดไปแล้ว — กรุณาตรวจสอบวันที่');
}

function makePad(canvas){

  // • เก็บทุกจุดที่เครื่องส่งมา (getCoalescedEvents) และวาดเป็นเส้นโค้งต่อเนื่อง
  // • สนใจนิ้ว/ปากกาเพียงจุดเดียว (กันฝ่ามือแตะจอแล้วเส้นกระโดด) — ถ้าใช้ Apple Pencil จะไม่สนใจการแตะด้วยมือ
  // • กันไม่ให้ iPad เลื่อนหน้า/ซูม/เลือกข้อความระหว่างเซ็น
  const ctx = canvas.getContext('2d'), r = Math.max(1, window.devicePixelRatio||1);

  ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = ctx.fillStyle = '#10204a';
  let active = null, activeType = '', pts = [], dirty = false;
  const pos = e => { const b = canvas.getBoundingClientRect(); return {x:(e.clientX-b.left)*(w/(b.width||w)), y:(e.clientY-b.top)*(h/(b.height||h))}; };
  const mid = (a,b) => ({x:(a.x+b.x)/2, y:(a.y+b.y)/2});
  function add(p){
    const l = pts[pts.length-1];
    if(l && Math.abs(l.x-p.x) + Math.abs(l.y-p.y) < 0.4) return;
    pts.push(p);
    const n = pts.length; if(n < 2) return;
    const a = pts[n-3] || pts[n-2], b = pts[n-2], c = pts[n-1];
    const s = n===2 ? b : mid(a,b), e = mid(b,c);
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.quadraticCurveTo(b.x, b.y, e.x, e.y); ctx.stroke();
  }
  function finish(){
    const n = pts.length;
    if(n >= 2){ const b = pts[n-2], c = pts[n-1], s = mid(b,c); ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(c.x, c.y); ctx.stroke(); }
    active = null; activeType = ''; pts = [];
  }
  canvas.addEventListener('pointerdown', e=>{
    e.preventDefault();
    if(active !== null){
      if(e.pointerType==='pen' && activeType!=='pen'){ pts = []; }   // ปากกามาทีหลังฝ่ามือ → ใช้ปากกา
      else return;                                                   // นิ้ว/ฝ่ามือที่สอง → ไม่สนใจ
    }
    active = e.pointerId; activeType = e.pointerType;
    try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
    const p = pos(e); pts = [p];
    ctx.beginPath(); ctx.arc(p.x, p.y, ctx.lineWidth/2, 0, Math.PI*2); ctx.fill();
    dirty = true;
  });
  canvas.addEventListener('pointermove', e=>{
    if(e.pointerId !== active) return;
    e.preventDefault();
    const list = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    (list.length ? list : [e]).forEach(ev=>add(pos(ev)));
  });
  const end = e => { if(e.pointerId === active){ add(pos(e)); finish(); } };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', e=>{ if(e.pointerId===active) finish(); });
  canvas.addEventListener('lostpointercapture', e=>{ if(e.pointerId===active) finish(); });
  ['touchstart','touchmove','touchend','gesturestart'].forEach(t=>canvas.addEventListener(t, ev=>ev.preventDefault(), {passive:false}));
  canvas.addEventListener('contextmenu', ev=>ev.preventDefault());
  return {
    clear(){ ctx.clearRect(0,0,w,h); dirty = false; pts = []; },
    empty:()=>!dirty,
    data(){ // ลดขนาดเป็นกว้างไม่เกิน 600 px (เส้นยังคมและต่อเนื่อง)
      const tw = Math.min(600, w), th = Math.round(h*tw/w);
      const o = document.createElement('canvas'); o.width = tw; o.height = th;
      const x = o.getContext('2d'); x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
      x.drawImage(canvas, 0, 0, tw, th); return o.toDataURL('image/png');
    }
  };
}

function renderKiosk(){
  const m = cur(), k = ui.k, box = $('#kiosk');

  box.classList.remove('hidden');
  const top = `<div class="k-top"><div><h2>ลงชื่อเข้าประชุม</h2><div class="m">${esc(m.title)}${m.no?' ครั้งที่ '+esc(m.no):''} · ${thaiDate(m.date)}</div></div>

  let body = '';

    body = `<h2 style="margin:0 0 4px;font-weight:600">แตะที่ชื่อของท่าน</h2><p class="hint" style="margin:0 0 16px;font-size:15px">ลงชื่อแล้ว ${done.length} จาก ${m.people.length} คน</p>

      ${done.map(p=>`<div class="k-name done">✓ ${esc(p.name)}<small>ลงชื่อแล้ว ${p.time?tm(p.time)+' น.':''}</small></div>`).join('')}</div>
      <div style="text-align:center;margin-top:24px"><button class="btn k-big" data-k="newp">ไม่พบชื่อ — ลงทะเบียนใหม่</button></div>`;
  } else if(k.step==='sign' || k.step==='newp'){
    const p = k.step==='sign' ? m.people.find(x=>x.id===k.pid) : null;
    body = `<div class="card" style="max-width:640px;margin:0 auto">
      ${p?`<h2 style="margin:0;font-weight:600">${esc(p.name)}</h2><p class="hint" style="margin:2px 0 14px;font-size:15px">${esc(p.role||p.position||'')}</p>`

          <div class="grid g2" style="margin-bottom:14px">
            <label class="f span2">ชื่อ – สกุล<input class="inp k-big" id="kName" style="font-size:17px"></label>
            <label class="f">ตำแหน่ง<input class="inp" id="kPos"></label>
            <label class="f">หน่วยงาน<input class="inp" id="kOrg"></label>
          </div>`}
      <div class="hint" style="margin-bottom:6px">ลงลายมือชื่อในกรอบด้านล่าง</div>
      <canvas class="pad" id="kpad" style="height:240px"></canvas>
      <div class="row" style="margin-top:12px">
        <label class="row" style="gap:6px;font-size:16px"><input type="radio" name="kst" value="present" checked> เข้าประชุมที่ห้อง</label>
        <label class="row" style="gap:6px;font-size:16px"><input type="radio" name="kst" value="online"> ออนไลน์</label>
        <span style="flex:1"></span><button class="btn" data-k="clr">ล้างลายเซ็น</button>
      </div>
      <div class="row" style="justify-content:space-between;margin-top:18px">
        <button class="btn k-big" data-k="back">← กลับ</button>
        <button class="btn primary k-big" data-k="ok">ยืนยันการลงชื่อ</button>
      </div></div>`;
  } else if(k.step==='done'){
    body = `<div class="k-done"><div class="ok">✓</div><h2 style="margin:0 0 6px">ลงชื่อเรียบร้อย</h2><p class="hint" style="font-size:16px">${esc(k.name||'')} · เวลา ${tm(nowTime())} น.</p></div>`;
  }
  box.innerHTML = top + `<div class="k-body">${body}</div>`;

$('#kiosk').addEventListener('click', e=>{
  const el = e.target.closest('[data-k]'); if(!el) return;
  const m = cur(), k = ui.k, a = el.dataset.k;
  if(a==='exit'){ ui.k=null; renderKiosk(); }
  else if(a==='pick'){ ui.k={step:'sign', pid:el.dataset.id}; renderKiosk(); }
  else if(a==='newp'){ ui.k={step:'newp'}; renderKiosk(); }
  else if(a==='back'){ ui.k={step:'list'}; renderKiosk(); }
  else if(a==='clr'){ k.pad.clear(); }
  else if(a==='ok'){
    if(k.pad.empty()){ toast('กรุณาลงลายมือชื่อก่อน'); return; }
    const st = document.querySelector('input[name=kst]:checked').value;
    let p;
    if(k.step==='sign') p = m.people.find(x=>x.id===k.pid);
    else {
      const name = $('#kName').value.trim(); if(!name){ toast('กรุณากรอกชื่อ – สกุล'); $('#kName').focus(); return; }
      p = newPerson({name, position:$('#kPos').value.trim(), org:$('#kOrg').value.trim(), role:'ผู้เข้าร่วมประชุม', type:'guest'}); m.people.push(p);
    }
    p.sig = k.pad.data(); p.status = st; p.time = nowTime(); p.updated = Date.now(); save();
    ui.k = {step:'done', name:p.name}; renderKiosk();
    setTimeout(()=>{ if(ui.k && ui.k.step==='done'){ ui.k={step:'list'}; renderKiosk(); } }, 2200);
  }
});

function mHash(m){
  const {updated, syncedAt, base, _h, ...rest} = m;
  const s = JSON.stringify(rest); let h = 0x811c9dc5;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }

}
const isDirty = m => mHash(m) !== m._h;

    badurl:'ลิงก์ Apps Script ใน config.js ไม่ถูกต้อง หรือยังไม่ได้ตั้งค่าให้ “ทุกคน” เข้าถึงได้',
    auth:'หมดเวลาการเข้าสู่ระบบ', wrong:'รหัสผ่านไม่ถูกต้อง', locked:'ใส่รหัสผิดหลายครั้ง ระบบล็อกชั่วคราว 15 นาที',
    nopw:'ยังไม่ได้ตั้งรหัสผ่าน — ให้ผู้ดูแลรันฟังก์ชัน setup ใน Apps Script', short:'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร'})[c] || String(c);
}
function mergePeopleInto(l, r){
  const del = new Set([...(l.deletedPeople||[]), ...(r.deletedPeople||[])]);
  l.deletedPeople = [...del];
  const map = new Map(l.people.map(p=>[p.id,p]));
  (r.people||[]).forEach(p=>{ if(del.has(p.id)) return; const x = map.get(p.id); if(!x) l.people.push(p); else if((p.updated||0) > (x.updated||0)) Object.assign(x, p); });
  l.people = l.people.filter(p=>!del.has(p.id));
}
function applyRemote(r, sentHash, changed){
  const i = S.meetings.findIndex(m=>m.id===r.id);
  if(i<0){
    if((S.delQ||[]).includes(r.id)) return;
    r.syncedAt = r.updated; r._h = mHash(r); S.meetings.push(r); changed.add(r.id); return;
  }
  const l = S.meetings[i];
  if(sentHash===undefined && r.updated <= (l.syncedAt||0)) return;
  const clean = mHash(l) === (sentHash!==undefined ? sentHash : l._h);
  if(clean){
    const before = mHash(l);
    r.syncedAt = r.updated; r._h = mHash(r);
    for(const k of Object.keys(l)) delete l[k]; Object.assign(l, r);
    if(r._h !== before) changed.add(r.id);
  } else {
    const before = JSON.stringify(l.people);
    mergePeopleInto(l, r); l.syncedAt = r.updated;
    if(JSON.stringify(l.people) !== before) changed.add(l.id);
  }
}
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function scheduleSync(delay=2000){ clearTimeout(sync.timer); if(syncOn()) sync.timer = setTimeout(syncNow, delay); }
async function syncNow(){
  if(!syncOn()) return;
  if(sync.busy){ sync.again = true; return; }
  sync.busy = true; setSync('busy');
  const changed = new Set();
  try{
    if(S.delQ && S.delQ.length){ const ids=[...S.delQ]; await api({action:'delete', ids}); S.delQ = (S.delQ||[]).filter(x=>!ids.includes(x)); }
    const dirty = S.meetings.filter(isDirty);
    if(dirty.length){
      const sent = new Map(dirty.map(m=>[m.id, mHash(m)]));
      const payload = dirty.map(m=>{ const {_h, syncedAt, ...rest} = m; return Object.assign(rest, {base:syncedAt||0}); });
      const res = await api({action:'save', meetings:payload});
      res.meetings.forEach(r=>applyRemote(r, sent.get(r.id), changed));
    }
    const res = await api({action:'list', since: Math.max(0, (S.since||0) - 3000)});
    res.meetings.forEach(r=>applyRemote(r, undefined, changed));
    const ids = new Set(res.ids), before = S.meetings.length;
    S.meetings = S.meetings.filter(m => ids.has(m.id) || !m.syncedAt || isDirty(m));
    if(S.meetings.length !== before) changed.add('*');
    if(!S.meetings.find(m=>m.id===S.cur)){ const nx = [...S.meetings].sort((x,y)=>(y.date||'').localeCompare(x.date||''))[0]; S.cur = nx ? nx.id : null; if(nx) changed.add('*'); }
    S.since = res.now; sync.last = Date.now(); persist(); setSync('ok');
    if(changed.size) refreshAfterSync();
  }catch(e){
    if(e.code!=='auth'){ console.warn('sync', e); setSync('err', errText(e)); }
  }finally{
    sync.busy = false;
    if(sync.again){ sync.again = false; scheduleSync(800); }
  }
}

/* ---------- แปลงข้อความจากคำสั่งแต่งตั้งเป็นรายชื่อ ---------- */
const ROLE_RE = /(ประธานคณะกรรมการ|ประธานกรรมการ|รองประธานคณะกรรมการ|รองประธานกรรมการ|กรรมการและผู้ช่วยเลขานุการ|กรรมการและเลขานุการ|ผู้ช่วยเลขานุการ|เลขานุการ|อนุกรรมการ|ที่ปรึกษา|รองประธาน|ประธาน|กรรมการ)/;
const NAME_PREFIX = /^(ศาสตราจารย์เกียรติคุณ|ศาสตราจารย์|รองศาสตราจารย์|ผู้ช่วยศาสตราจารย์|อาจารย์|ร้อยเอกหญิง|ร้อยเอก|ร้อยโทหญิง|ร้อยโท|พันเอก|พันโท|พันตรี|นาวาอากาศเอก|[ก-ฮA-Za-z]{1,4}\.(?:[ก-ฮA-Za-z]{1,4}\.)*(?:หญิง)?)$/;
function normRole(r){
  r = r.replace('ประธานคณะกรรมการ','ประธานกรรมการ').replace('รองประธานคณะกรรมการ','รองประธานกรรมการ');
  if(r==='ประธาน') return 'ประธานกรรมการ'; if(r==='รองประธาน') return 'รองประธานกรรมการ'; return r;
}
function parseOrder(text){
  let lines = String(text||'').replace(/\r/g,'').split('\n').map(l=>l.replace(/\\/g,'').replace(/​/g,'').trim()).filter(Boolean);
  const out = {name:'', order:'', members:[]};
  // ชื่อคำสั่ง / เลขที่คำสั่ง
  lines.forEach(l=>{
    let k = l.match(/^เรื่อง\s+(.+)$/); if(k && !out.name) out.name = k[1].replace(/^แต่งตั้ง\s*/,'').trim();
    k = l.match(/^(?:#+\s*)?ที่\s*([0-9๐-๙]+\s*\/\s*[0-9๐-๙]{4})/); if(k && !out.order) out.order = thaiDigits(k[1].replace(/\s/g,''));
  });
  // ส่วนรายชื่อ: หลังบรรทัด "ดังนี้ / ดังรายชื่อ / ต่อไปนี้" จนถึง "เพื่อทำหน้าที่ / หน้าที่ / ทั้งนี้ / สั่ง ณ"
  const st = lines.findIndex(l=>/(ดังนี้|ดังรายชื่อ|ดังรายนาม|ต่อไปนี้)\s*:?\s*$/.test(l));
  if(st >= 0) lines = lines.slice(st+1);
  const en = lines.findIndex(l=>/^(\/?เพื่อทำหน้าที่|หน้าที่|ทั้งนี้|สั่ง\s*ณ|หมายเหตุ)/.test(l));
  if(en >= 0) lines = lines.slice(0, en);
  // รวมบรรทัดที่วงเล็บยังไม่ปิด
  const joined = [];
  lines.forEach(l=>{ const last = joined[joined.length-1]; if(last && (last.match(/\(/g)||[]).length > (last.match(/\)/g)||[]).length) joined[joined.length-1] = last + ' ' + l; else joined.push(l); });
  joined.forEach(line=>{
    if(line.includes('\t')){ // วางจาก Excel: ชื่อ | ตำแหน่ง | ตำแหน่งในคณะกรรมการ
      const c = line.split('\t').map(x=>x.trim());
      if(c[0]) out.members.push({name:c[0].replace(/^[0-9๐-๙]+[.)]\s*/,''), position:c[1]||'', role:normRole(c[2]||'กรรมการ'), org:c[3]||''});
      return;
    }
    let s = line.replace(/^[0-9๐-๙]+\s*[.)]?\s*/,'').trim();
    if(!s || s.length < 4) return;
    let position = '';
    s = s.replace(/\(([^()]*)\)/g, (_,x)=>{ position += (position?' ':'') + x.trim(); return ' '; }).replace(/\s+/g,' ').trim();
    let role = 'กรรมการ';
    const rm = s.match(new RegExp('\\s' + ROLE_RE.source + '(?=\\s|$)'));
    let rest = '';
    if(rm){ role = normRole(rm[1]); rest = s.slice(rm.index + rm[0].length).trim(); s = s.slice(0, rm.index).trim(); }
    // ชื่อ = คำนำหน้า + ชื่อ + นามสกุล
    const tk = s.split(' '); let i = 0; const pre = [];
    while(i < tk.length - 1 && NAME_PREFIX.test(tk[i])){ pre.push(tk[i]); i++; }
    const name = pre.concat(tk.slice(i, i+2)).join(' ');
    const extra = tk.slice(i+2).join(' ').trim();
    if(!position && (extra || rest)) position = [extra, rest].filter(Boolean).join(' ');
    else if(extra || rest) position = [position, extra, rest].filter(Boolean).join(' ');
    if(name.replace(/\s/g,'').length >= 3) out.members.push({name, position: position.trim(), role, org:''});
  });
  return out;
}
// คีย์เทียบชื่อคนเดียวกันที่เขียนต่างกัน (ตัดยศ/คำนำหน้า เหลือชื่อ+นามสกุล)
function nameKey(n){
  const tk = String(n||'').replace(/\s+/g,' ').trim().split(' ').filter(t=>!NAME_PREFIX.test(t));
  if(!tk.length) return '';
  const first = tk[0].replace(/^(แพทย์หญิง|นายแพทย์|ทันตแพทย์หญิง|ทันตแพทย์|เภสัชกรหญิง|เภสัชกร|พญ\.|นพ\.|ทพญ\.|ทพ\.|ภญ\.|ภก\.|พว\.|นางสาว|น\.ส\.|นาง|นาย)/,'');
  return (first + (tk.length > 1 ? tk[tk.length-1] : '')).toLowerCase();
}
function thaiDigits(s){ return String(s).replace(/[๐-๙]/g, d=>'๐๑๒๓๔๕๖๗๘๙'.indexOf(d)); }

/* ---------- นำเข้ารายชื่อคณะกรรมการจากไฟล์ Excel / CSV ---------- */
function loadXlsxLib(){
  return window.XLSX ? Promise.resolve() : new Promise((ok,no)=>{ const sc=document.createElement('script'); sc.src='assets/xlsx.full.min.js'; sc.onload=ok; sc.onerror=()=>no(new Error('โหลดตัวอ่านไฟล์ Excel ไม่ได้')); document.head.appendChild(sc); });
}
/* ---------- อ่านคำสั่งแต่งตั้ง (Word .docx) ---------- */
function docxLines(buf){
  const z = XLSX.CFB.read(new Uint8Array(buf), {type:'array'});
  const e = XLSX.CFB.find(z, 'word/document.xml') || XLSX.CFB.find(z, '/word/document.xml');
  if(!e) throw new Error('ไม่ใช่ไฟล์ Word (.docx)');
  const xml = new TextDecoder('utf-8').decode(new Uint8Array(e.content));
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main', lines = [];
  for(const p of doc.getElementsByTagNameNS(W, 'p')){
    let s = '';
    for(const n of p.getElementsByTagNameNS(W, '*')){
      if(n.localName === 't') s += n.textContent;
      else if(n.localName === 'tab' && n.parentNode && n.parentNode.localName === 'r') s += '\t';
      else if((n.localName === 'br' || n.localName === 'cr') && n.parentNode && n.parentNode.localName === 'r') s += '\n';
    }
    s.split('\n').forEach(x=>lines.push(x));
  }
  return lines;
}
const ROLE_CELL = /^(ประธานคณะกรรมการ|ประธานกรรมการ|รองประธานคณะกรรมการ|รองประธานกรรมการ|กรรมการและผู้ช่วยเลขานุการ|กรรมการและเลขานุการ|ผู้ช่วยเลขานุการ|เลขานุการ|ประธาน|รองประธาน|กรรมการ)$/;
const PRE_CELL = /^(ศาสตราจารย์|รองศาสตราจารย์|ผู้ช่วยศาสตราจารย์|อาจารย์|[ก-ฮA-Za-z]{1,4}\.(?:[ก-ฮA-Za-z]{1,4}\.)*)$/;
function parseOrderDoc(lines){
  const out = {name:'', order:'', members:[]};
  const dept = String((lh().text||'').split('\n')[0]||'').trim();
  for(const l of lines){
    const t = l.replace(/\t/g,' ').replace(/\s+/g,' ').trim();
    let k = t.match(/^เรื่อง\s+(.+)$/); if(k && !out.name) out.name = k[1].replace(/^แต่งตั้ง\s*/,'').trim();
    k = t.match(/^(?:#+\s*)?ที่\s*([0-9๐-๙]+)\s*\/\s*([0-9๐-๙]{4})/); if(k && !out.order) out.order = thaiDigits(k[1]+'/'+k[2]);
  }
  out.name = out.name.replace(/\s*ประจำปี\s*(พ\.ศ\.\s*)?[0-9๐-๙]{4}\s*$/,'');
  if(dept && /ภาควิชาฯ$/.test(out.name)) out.name = out.name.replace(/ภาควิชาฯ$/, dept);
  const s = lines.findIndex(l=>/(ต่อไปนี้|ดังนี้)\s*:?\s*$/.test(l.trim()) || /ดัง(มี)?(รายนาม|รายชื่อ)/.test(l));
  if(s < 0) return parseOrder(lines.join('\n'));
  let e = lines.findIndex((l,i)=>i>s && /(หน้าที่|อำนาจ)/.test(l) && !/^\d/.test(l.replace(/^[\s\t]+/,'')));
  if(e < 0) e = lines.length;
  const cells = [];
  lines.slice(s+1, e).forEach(l=>{ if(l.trim().startsWith('/')) return; l.split('\t').map(c=>c.trim()).filter(Boolean).forEach(c=>cells.push(c)); });
  const mem = []; let cur = null, group = '';
  for(const c of cells){
    const m = c.match(/^(\d+(?:\.\d+)?)\.?\s*(.*)$/);
    if(m && (m[2]==='' || !/^\d/.test(m[2]))){
      const rest = m[2].trim();
      if(rest.startsWith('ด้าน')){ group = rest; cur = null; continue; }
      cur = {first:rest, sur:'', pos:'', role:'', group}; mem.push(cur); continue;
    }
    if(!cur){ if(c.startsWith('ด้าน')) group = c; continue; }
    if(!cur.first){ if(c.startsWith('ด้าน')){ group = c; mem.pop(); cur = null; continue; } cur.first = c; cur.group = group; continue; }
    if(ROLE_CELL.test(c)){ cur.role = normRole(c); continue; }
    if(c.startsWith('(') && cur.pos){ cur.pos += ' ' + c; continue; }
    const nonpre = cur.first.split(/\s+/).filter(x=>x && !PRE_CELL.test(x));
    if(!cur.sur && nonpre.length < 2){ cur.sur = c; continue; }
    cur.pos = cur.pos ? cur.pos + ' ' + c : c;
  }
  const defRole = /ผู้ตรวจติดตาม/.test(out.name) ? 'ผู้ตรวจติดตามภายใน' : 'กรรมการ';
  out.members = mem.filter(x=>x.first).map(x=>{
    let pos = x.pos.replace(/\s+/g,' ').trim();
    if(x.group) pos = (pos + ' — รับผิดชอบ' + x.group).replace(/^ — /,'');
    return {name:(x.first+' '+x.sur).replace(/\s+/g,' ').trim(), position:pos, role:x.role || defRole, org:''};
  });
  if(!out.members.length) return Object.assign(parseOrder(lines.join('\n')), {name: out.name, order: out.order});
  return out;
}

async function readTableFile(file, buf){
  let wb;
  if(/\.csv$/i.test(file.name)){
    let text = new TextDecoder('utf-8').decode(buf);
    if(text.includes('�')) try{ text = new TextDecoder('windows-874').decode(buf); }catch(e){}
    wb = XLSX.read(text, {type:'string'});
  } else wb = XLSX.read(buf, {type:'array'});
  const sh = wb.Sheets[wb.SheetNames.find(n=>/คณะกรรมการ/.test(n)) || wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sh, {header:1, defval:'', raw:false}).map(r=>r.map(c=>String(c).replace(/[​﻿]/g,'').trim()));
  const hi = rows.findIndex(r=>r.some(c=>/คณะกรรมการ/.test(c) && c.length<=20) && r.some(c=>/^ชื่อ/.test(c)));
  if(hi < 0){
    const first = (rows.find(r=>r.some(Boolean))||[]).filter(Boolean).slice(0,6).join(' | ');
    throw new Error(`“${file.name}” ไม่มีหัวตาราง “คณะกรรมการ” และ “ชื่อ - สกุล”${first?' (แถวแรกของไฟล์: '+first+')':''}`);
  }
  const h = rows[hi], col = re => h.findIndex(x=>re.test(x));
  const ci = {c:col(/^(ชื่อ)?คณะกรรมการ$/), order:col(/^คำสั่ง/), seq:col(/^ลำดับ/), name:col(/^ชื่อ\s*[-–]?\s*(สกุล|นามสกุล)?$|^ชื่อ$/), pos:col(/^ตำแหน่ง$|^ตำแหน่ง\s*\/|^ตำแหน่งงาน/), role:col(/ตำแหน่งในคณะ/), org:col(/หน่วยงาน/)};
  if(ci.c < 0) ci.c = h.findIndex(x=>/คณะกรรมการ/.test(x) && !/ตำแหน่ง/.test(x));
  const map = new Map();
  rows.slice(hi+1).forEach((r,i)=>{
    const cn = String(r[ci.c]||'').trim(); if(!cn) return;
    if(!map.has(cn)) map.set(cn, {name:cn, order:'', members:[]});
    const c = map.get(cn), v = k => ci[k]>=0 ? String(r[ci[k]]||'').trim() : '';
    if(!c.order && v('order')) c.order = v('order');
    if(v('name')) c.members.push({name:v('name'), position:v('pos'), role:normRole(v('role')||'กรรมการ'), org:v('org'), _n:Number(v('seq'))||1000+i});
  });
  return [...map.values()].map(c=>{ c.members.sort((a,b)=>a._n-b._n).forEach(m=>delete m._n); return c; });
}
async function importCommFiles(files){
  const incoming = [], errs = [];
  try{ await loadXlsxLib(); }catch(e){ toast(e.message); return; }
  for(const file of files){
    try{
      const buf = await file.arrayBuffer();
      if(/\.docx$/i.test(file.name)){
        const c = parseOrderDoc(docxLines(buf));
        if(!c.name) c.name = file.name.replace(/\.docx$/i,'').replace(/^คำสั่ง\S*\s+[0-9๐-๙]+[-/][0-9๐-๙]+\s*/,'').replace(/^แต่งตั้ง\s*/,'');
        if(!c.members.length) throw new Error(`“${file.name}” — ไม่พบรายชื่อในคำสั่ง`);
        incoming.push(c);
      } else if(/\.doc$/i.test(file.name)){
        throw new Error(`“${file.name}” เป็น Word รุ่นเก่า (.doc) — กรุณาเปิดแล้ว “บันทึกเป็น .docx” ก่อน`);
      } else if(/\.(xlsx|xls|csv)$/i.test(file.name)) (await readTableFile(file, buf)).forEach(c=>incoming.push(c));
      else throw new Error(`“${file.name}” — รองรับเฉพาะไฟล์คำสั่ง Word (.docx) หรือ Excel (.xlsx, .csv)`);
    }catch(e){ errs.push(e.message); }
  }
  if(!incoming.length){ openModal(`<h3>นำเข้าไม่สำเร็จ</h3><div style="color:var(--bad);font-size:14.5px;line-height:1.7">${errs.map(esc).join('<br>')}</div><p class="hint">เลือกไฟล์คำสั่งแต่งตั้ง (.docx) หรือไฟล์ Excel ที่มีคอลัมน์ คณะกรรมการ | ชื่อ - สกุล | ตำแหน่ง | ตำแหน่งในคณะกรรมการ</p><div class="row" style="justify-content:flex-end"><button class="btn" id="imBack">กลับ</button></div>`); $('#imBack').onclick=()=>openCommittees(); return; }
  // รวมคณะกรรมการชื่อซ้ำในชุดที่นำเข้า (ใช้ฉบับหลังสุด)
  const uniq = []; incoming.forEach(c=>{ const i = uniq.findIndex(x=>x.name===c.name); if(i>=0) uniq[i] = c; else uniq.push(c); });
  return previewImport(uniq, errs);
}

  $('#modal').querySelectorAll('[data-cmdel]').forEach(b=>b.onclick = ()=>{ sync(); c.members.splice(+b.dataset.cmdel,1); renderCommEdit(); });
  $('#modal').querySelectorAll('[data-cmup]').forEach(b=>b.onclick = ()=>{ sync(); const i=+b.dataset.cmup; if(i>0){ [c.members[i-1],c.members[i]]=[c.members[i],c.members[i-1]]; renderCommEdit(); } });
  $('#cmAddRow').onclick = ()=>{ sync(); c.members.push({name:'', position:'', role:'กรรมการ', org:''}); renderCommEdit(); const ins=$('#modal').querySelectorAll('[data-cmf="name"]'); ins[ins.length-1].focus(); };
  $('#cmParse').onclick = ()=>{
    sync(); const r = parseOrder($('#cmPaste').value);
    if(!r.members.length){ $('#cmParseMsg').textContent = 'ไม่พบรายชื่อ — ลองวางเฉพาะบรรทัดรายชื่อ บรรทัดละ 1 คน'; return; }
    if(!c.name && r.name) c.name = r.name; if(!c.order && r.order) c.order = r.order;
    c.members = $('#cmReplace').checked ? r.members : c.members.concat(r.members);
    renderCommEdit(); $('#cmMsg').innerHTML = `<span style="color:var(--ok)">✓ แปลงได้ ${r.members.length} รายชื่อ — ตรวจสอบชื่อและตำแหน่งก่อนกดบันทึก</span>`;
  };
  $('#cmBack').onclick = $('#cmCancel').onclick = ()=>renderCommList();
  $('#cmSave').onclick = async ()=>{
    sync();
    if(!c.name){ $('#cmMsg').innerHTML = '<span style="color:var(--bad)">กรุณาใส่ชื่อคณะกรรมการ</span>'; $('#cmName').focus(); return; }
    c.members = c.members.filter(m=>String(m.name||'').trim());
    const list = JSON.parse(JSON.stringify(commList()));
    if(list.some((x,i)=>x.name===c.name && i!==commEdit.idx)){ $('#cmMsg').innerHTML = '<span style="color:var(--bad)">มีคณะกรรมการชื่อนี้อยู่แล้ว</span>'; return; }
    const oldName = commEdit.idx>=0 ? list[commEdit.idx].name : null;
    if(commEdit.idx>=0) list[commEdit.idx] = c; else list.push(c);
    $('#cmSave').disabled = true; $('#cmSave').textContent = 'กำลังบันทึก…';
    try{
      await saveCommittees(list);
      if(oldName && oldName!==c.name){ S.meetings.forEach(m=>{ if(m.committee===oldName) m.committee = c.name; }); save(); }
      toast('บันทึกรายชื่อคณะกรรมการแล้ว'); renderCommList();
    }catch(e){ $('#cmMsg').innerHTML = `<span style="color:var(--bad)">บันทึกไม่สำเร็จ: ${esc(errText(e))}</span>`; $('#cmSave').disabled=false; $('#cmSave').textContent='💾 บันทึก'; }
  };
  const del = $('#cmDel');
  if(del) del.onclick = ()=>{
    if(!confirm('ลบคณะกรรมการ “'+c.name+'”? (การประชุมที่สร้างไว้แล้วไม่ถูกลบ)')) return;
    const list = commList().filter((_,i)=>i!==commEdit.idx);
    saveCommittees(list).then(()=>{ toast('ลบคณะกรรมการแล้ว'); renderCommList(); }).catch(e=>{ $('#cmMsg').innerHTML = `<span style="color:var(--bad)">${esc(errText(e))}</span>`; });
  };
}

/* ---------- สร้างการประชุมใหม่: เลือกคณะกรรมการ ---------- */
function blankMeeting(){
  const nm = newMeeting(); S.meetings.push(nm); S.cur = nm.id; ui.tab='info'; save(); render(); $('#side').classList.remove('open');
  setTimeout(()=>{ const t=document.querySelector('[data-b="m.title"]'); t&&t.focus(); },30);
}
function meetingFromCommittee(c){
  const ms = c.members || [];
  const chair = ms.find(x=>isChair(x.role)), sec = ms.find(x=>isSecretary(x.role));
  const nm = newMeeting({
    title: commTitle(c.name), committee: c.name, no: commNextNo(c.name),
    chair: chair ? chair.name : '', secretary: sec ? sec.name : '', recorder: sec ? sec.name : '',
    people: ms.map(x=>newPerson({name:x.name, position:x.position||'', org:x.org||'', role:x.role||'กรรมการ', type:'member'}))
  });
  const last = S.meetings.filter(m=>m.committee===c.name).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
  if(last){ nm.venue = last.venue; nm.mode = last.mode; nm.start = last.start; nm.end = last.end; nm.link = last.link; nm.checker = last.checker; }
  S.meetings.push(nm); S.cur = nm.id; ui.tab='info'; save(); render(); $('#side').classList.remove('open');
  toast(`สร้างการประชุมและดึงรายชื่อ ${ms.length} คนแล้ว — กรุณาตรวจสอบวันที่และสถานที่`);
}
async function openNewMeeting(){
  openModal(`<h3>สร้างการประชุมใหม่</h3><p class="hint">กำลังโหลดรายชื่อคณะกรรมการ…</p>`);
  await loadCommittees();
  const list = commList();
  $('#modal').innerHTML = `<div class="mbox" style="width:min(860px,100%)">
    <h3 style="margin:0 0 4px">สร้างการประชุมใหม่</h3>
    <p class="hint" style="margin:0 0 14px">เลือกคณะกรรมการ — ระบบจะตั้งชื่อการประชุม ครั้งที่ ประธาน เลขานุการ และดึงรายชื่อกรรมการมาให้</p>
    ${list.length ? `<input class="inp" id="nmQ" placeholder="ค้นหาคณะกรรมการ…" style="margin-bottom:10px">
      <div class="cm-grid" id="nmList">${list.map((c,i)=>`
        <button class="cm-card" data-nm="${i}"><div class="cm-name">${esc(c.name)}</div>
          <div class="cm-meta">${c.members.length} คน · ครั้งถัดไป ${esc(commNextNo(c.name))}</div></button>`).join('')}</div>`
      : `<div class="empty" style="padding:24px 10px"><b>ยังไม่มีรายชื่อคณะกรรมการ</b><p>เพิ่มคณะกรรมการไว้ก่อน แล้วครั้งต่อไปจะดึงรายชื่อได้ทันที</p></div>`}
    <div class="row" style="justify-content:space-between;margin-top:16px">
      <button class="btn ghost" id="nmManage">👥 จัดการรายชื่อคณะกรรมการ</button>
      <div class="row"><button class="btn" data-close>ยกเลิก</button><button class="btn" id="nmBlank">เริ่มจากหน้าว่าง</button></div>
    </div></div>`;
  $('#modal').querySelectorAll('[data-nm]').forEach(b=>b.onclick = ()=>{ const c = list[+b.dataset.nm]; closeModal(); meetingFromCommittee(c); });
  const q = $('#nmQ'); if(q){ q.focus(); q.oninput = ()=>{ const k=q.value.trim().toLowerCase(); $('#modal').querySelectorAll('[data-nm]').forEach(b=>b.style.display = !k || list[+b.dataset.nm].name.toLowerCase().includes(k) ? '' : 'none'); }; }
  $('#nmBlank').onclick = ()=>{ closeModal(); blankMeeting(); };
  $('#nmManage').onclick = ()=>openCommittees();
}
/* ---------- ดึงรายชื่อเข้าการประชุมที่มีอยู่ ---------- */
async function pullCommittee(m){
  openModal(`<h3>ดึงรายชื่อจากคณะกรรมการ</h3><p class="hint">กำลังโหลด…</p>`);
  await loadCommittees();
  const list = commList();
  if(!list.length){ $('#modal .mbox').innerHTML = `<h3>ดึงรายชื่อจากคณะกรรมการ</h3><p class="hint">ยังไม่มีรายชื่อคณะกรรมการ</p><div class="row" style="justify-content:flex-end"><button class="btn" data-close>ปิด</button><button class="btn primary" id="pcManage">👥 เพิ่มคณะกรรมการ</button></div>`; $('#pcManage').onclick=()=>openCommittees(); return; }
  const def = Math.max(0, list.findIndex(c=>c.name===m.committee));
  $('#modal .mbox').innerHTML = `<h3>ดึงรายชื่อจากคณะกรรมการ</h3>
    <select class="inp" id="pcSel" style="margin:10px 0">${list.map((c,i)=>`<option value="${i}" ${i===def?'selected':''}>${esc(c.name)} (${c.members.length} คน)</option>`).join('')}</select>
    <p class="hint">ชื่อที่มีอยู่แล้วในการประชุมนี้จะไม่ถูกเพิ่มซ้ำ</p>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-close>ยกเลิก</button><button class="btn primary" id="pcOk">ดึงรายชื่อ</button></div>`;
  $('#pcOk').onclick = ()=>{
    const c = list[+$('#pcSel').value]; let n = 0;
    const has = new Set(m.people.map(p=>nameKey(p.name)));
    c.members.forEach(x=>{ const k = nameKey(x.name); if(has.has(k)) return; has.add(k); m.people.push(newPerson({name:x.name, position:x.position||'', org:x.org||'', role:x.role||'กรรมการ', type:'member'})); n++; });
    if(!m.committee) m.committee = c.name;
    if(!m.chair){ const ch=c.members.find(x=>isChair(x.role)); if(ch) m.chair=ch.name; }
    if(!m.secretary){ const s=c.members.find(x=>isSecretary(x.role)); if(s){ m.secretary=s.name; if(!m.recorder) m.recorder=s.name; } }
    save(); closeModal(); render(); toast(`เพิ่ม ${n} รายชื่อจาก${c.name}`);
  };
}

applyDocFont();
if(syncOn()){ render(); syncNow().then(loadCommittees); } else { render(); showLogin(); }
</script>
